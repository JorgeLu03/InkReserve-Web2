<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b10" />
  <title>InkReserve — Iniciar sesión</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">

  <!-- Tipos (serif + sans moderna para UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- SweetAlert2 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Tu CSS (lo hacemos en el siguiente paso) -->
  <link rel="stylesheet" href="./login.css" />

  <!-- Fav icon opcional -->
  <!-- <link rel="icon" href="./favicon.ico" /> -->
</head>

<body class="ir-body">
  <!-- Fondo con partículas (opcional, se controla desde JS/CSS) -->
  <canvas id="irParticles" class="ir-particles" aria-hidden="true"></canvas>

  <main class="ir-stage">
    <section class="ir-card" role="region" aria-label="Inicio de sesión InkReserve">
      <!-- Glow / decor -->
      <div class="ir-card__glow" aria-hidden="true"></div>

      <!-- Layout interno (izq logo | der form) -->
      <div class="ir-card__inner">
        <!-- Lado izquierdo: logo -->
        <div class="ir-card__left">
          <div class="ir-logoWrap">
            <!-- Reemplaza el src por tu ruta real -->
            <img
              class="ir-logo"
              src="./InkReserveLogo.png"
              alt="InkReserve"
              draggable="false"
            />
          </div>

          <p class="ir-tagline">
            Reserva, agenda y gestiona tus citas con estilo.
          </p>

          <!-- Chips neon suaves (decorativos) -->
          <div class="ir-chips" aria-hidden="true">
            <span class="ir-chip">Artists</span>
            <span class="ir-chip">Bookings</span>
            <span class="ir-chip">Studios</span>
          </div>
        </div>

        <!-- Divider vertical (no parte por completo el recuadro) -->
        <div class="ir-divider" aria-hidden="true"></div>

        <!-- Lado derecho: formulario -->
        <div class="ir-card__right">
          <header class="ir-header">
            <h1 class="ir-title">Iniciar sesión</h1>
            <p class="ir-subtitle">Accede a tu cuenta para continuar.</p>
          </header>

          <form id="loginForm" class="ir-form" autocomplete="on" novalidate>
            <div class="ir-field">
              <label class="ir-label" for="email">Correo</label>
              <div class="ir-inputWrap">
                <span class="ir-icon" aria-hidden="true">✦</span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="ir-input"
                  placeholder="tu@correo.com"
                  autocomplete="email"
                  required
                />
              </div>
              <small class="ir-hint" id="emailHint">Usa el correo con el que te registraste.</small>
            </div>

            <div class="ir-field">
              <label class="ir-label" for="password">Contraseña</label>
              <div class="ir-inputWrap">
                <span class="ir-icon" aria-hidden="true">✦</span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="ir-input"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="ir-eyeBtn"
                  id="togglePassword"
                  aria-label="Mostrar u ocultar contraseña"
                >
                  <span class="ir-eyeBtn__txt">Ver</span>
                </button>
              </div>
              <small class="ir-hint">Mínimo 8 caracteres recomendado.</small>
            </div>

            <div class="ir-row">
              <label class="ir-check">
                <input id="remember" name="remember" type="checkbox" />
                <span class="ir-check__box" aria-hidden="true"></span>
                <span class="ir-check__txt">Recordarme</span>
              </label>

              <a class="ir-link" href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="ir-btn ir-btn--primary" id="btnLogin">
              <span class="ir-btn__glow" aria-hidden="true"></span>
              Iniciar sesión
            </button>

            <div class="ir-footer">
              <p class="ir-footer__txt">
                ¿No tienes cuenta?
                <a class="ir-link ir-link--accent" href="#" id="goRegister">Crear una</a>
              </p>
            </div>
          </form>
        </div>
      </div>

      <!-- Borde interior sutil -->
      <div class="ir-card__stroke" aria-hidden="true"></div>
    </section>
  </main>

  <!-- Imagen de fondo (solo para precargar; el fondo real lo ponemos por CSS) -->
  <img src="./GrafitiRosa" alt="" class="ir-preload" aria-hidden="true" />

  <!-- Tu JS (lo hacemos en el siguiente paso, incluyendo SweetAlert2 theme) -->
  <script src="./login.js"></script>
</body>
</html>
